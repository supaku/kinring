name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, attach tarball, publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Not `pnpm ci`: pnpm treats that as an install alias and never runs the script.
      - run: pnpm run verify
      - name: Check the build is in the package
        run: test -f dist/index.js && test -f dist/server/index.js && test -f dist/payload/index.js && test -f dist/embed.js
      - name: Check tag matches package version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "package.json is $pkg but tag is $tag"; exit 1; }
      - name: Pack
        run: pnpm pack
      - name: Attach tarball to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: supaku-kinring-*.tgz
          generate_release_notes: true
      # Trusted publishing: npm trusts this workflow via OIDC, no token needed.
      # Configure once at https://www.npmjs.com/package/@supaku/kinring/access
      # (publishing access → trusted publisher → GitHub Actions, repo supaku/kinring,
      # workflow release.yml). npm 11.5+ is required; Node 24 ships it.
      - name: Publish to npm
        run: npm publish --provenance --access public
